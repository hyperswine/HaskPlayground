name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cabal.project pins with-compiler: ghc-9.8.2 and a freeze file.
      - uses: haskell-actions/setup@v2
        id: hs
        with:
          ghc-version: '9.8.2'
          cabal-version: '3.12.1.0'
      - name: Trust the checkout (git safe.directory)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.hs.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc-9.8.2-${{ hashFiles('cabal.project', 'cabal.project.freeze', '*.cabal') }}
          restore-keys: ${{ runner.os }}-ghc-9.8.2-
      - run: cabal update
      - run: cabal build all
      - run: cabal test --test-show-details=direct
